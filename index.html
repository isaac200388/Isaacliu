<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彤神的个人主页</title>
<meta name="description" content="彤神，抖音口播系列「苏州理论」的作者。">
<meta property="og:title" content="彤神的个人主页">
<meta property="og:description" content="抖音口播系列「苏州理论」的作者。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
  /* 配色：粉墙、黛瓦、青苔、杨梅（东山杨梅的深紫红，只用在按钮上） */
  :root {
    --wall: #E9ECEA;
    --paper: #F6F7F5;
    --tile: #26343C;
    --mist: #B9C4BC;
    --bayberry: #7A1F45;
    --gutter: clamp(20px, 6vw, 80px);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--tile);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 17px;
    line-height: 1.85;
  }

  h1, h2 {
    margin: 0;
    font-family: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 400;
    line-height: 1;
  }
  p { margin: 0; }

  a:focus-visible {
    outline: 3px solid var(--bayberry);
    outline-offset: 4px;
  }

  /* 按钮 */
  .btn {
    display: inline-block;
    padding: 14px 30px;
    border-radius: 999px;
    background: var(--bayberry);
    color: var(--paper);
    font-weight: 500;
    font-size: 17px;
    line-height: 1.4;
    text-decoration: none;
    transition: background-color .2s;
  }
  .btn:hover { background: #5E1736; }

  /* 首屏 */
  .hero {
    min-height: 100svh;
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    align-items: center;
    gap: clamp(32px, 5vw, 72px);
    padding: clamp(40px, 8vw, 96px) var(--gutter);
  }
  .hero h1 {
    font-size: clamp(60px, 10.5vw, 148px);
    letter-spacing: .02em;
  }
  .lead {
    max-width: 24em;
    margin: clamp(20px, 3vw, 36px) 0 clamp(28px, 4vw, 44px);
    font-size: clamp(17px, 1.6vw, 20px);
    text-wrap: balance;
  }

  /* 圆洞门：照片的画框，页面里唯一的动效是它打开 */
  .gate {
    width: min(100%, 480px);
    aspect-ratio: 1;
    justify-self: center;
    padding: 14px;
    clip-path: circle(50%);
    animation: gate-open 1.1s cubic-bezier(.2, .7, .2, 1) both;
  }
  .gate-ring {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: clamp(10px, 1.6vw, 16px) solid var(--tile);
    box-shadow: 0 0 0 7px var(--wall), 0 0 0 9px var(--tile);
    background: var(--mist);
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .gate-ring img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .gate-empty {
    font-size: 15px;
    color: var(--tile);
    text-align: center;
    padding: 0 2em;
  }
  @keyframes gate-open {
    from { clip-path: circle(0%); }
    to   { clip-path: circle(50%); }
  }

  /* 关于我 */
  .about {
    background: var(--paper);
    padding: clamp(64px, 10vw, 140px) var(--gutter);
    display: grid;
    grid-template-columns: minmax(120px, 1fr) 3fr;
    gap: 32px;
  }
  .about h2 { font-size: clamp(32px, 4vw, 48px); }
  .about-body { max-width: 36em; }
  .about-body p + p { margin-top: 1.2em; }

  /* 找我 */
  .find {
    background: var(--tile);
    color: var(--paper);
    padding: clamp(64px, 10vw, 120px) var(--gutter);
  }
  .find h2 { font-size: clamp(32px, 4vw, 48px); }
  .find p { margin: 20px 0 32px; max-width: 30em; }
  .find .btn:focus-visible { outline-color: var(--paper); }

  .foot {
    padding: 28px var(--gutter);
    font-size: 14px;
    background: var(--tile);
    color: var(--mist);
  }

  @media (max-width: 819px) {
    .hero {
      grid-template-columns: 1fr;
      min-height: auto;
      padding-top: 56px;
      padding-bottom: 72px;
    }
    .hero h1 { font-size: min(21vw, 110px); }
    .gate { width: min(82vw, 380px); }
    .about { grid-template-columns: 1fr; gap: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gate { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>

<header class="hero">
  <div>
    <h1>苏州理论</h1>
    <p class="lead">我是彤神。在苏州长大，在伦敦读传媒，现在在抖音做口播，讲我自己的想法。</p>
    <!-- 把下面的链接换成你自己的抖音主页链接（页面里共两处） -->
    <a class="btn" href="https://www.douyin.com/search/%E5%BD%A4%E7%A5%9E" target="_blank" rel="noopener">去抖音看彤神</a>
  </div>

  <div class="gate">
    <div class="gate-ring">
      <p class="gate-empty">把照片命名为 photo.jpg，放进仓库就会显示在这里</p>
      <img src="photo.jpg" alt="彤神的照片" onerror="this.remove()">
    </div>
  </div>
</header>

<main>
  <section class="about" aria-labelledby="about-title">
    <h2 id="about-title">关于我</h2>
    <div class="about-body">
      <p>我叫 Isaac，朋友和观众叫我彤神。从小在苏州长大，在伦敦金史密斯大学（Goldsmiths）读完传媒本科，回到了苏州。</p>
      <p>「苏州理论」是我自己开的口播系列，在抖音更新。</p>
      <p>不拍视频的时候，我在打篮球、练身体。</p>
    </div>
  </section>

  <section class="find" aria-labelledby="find-title">
    <h2 id="find-title">来抖音找我</h2>
    <p>「苏州理论」在抖音更新，账号名是彤神。</p>
    <!-- 同上：换成你自己的抖音主页链接 -->
    <a class="btn" href="https://www.douyin.com/search/%E5%BD%A4%E7%A5%9E" target="_blank" rel="noopener">去抖音看彤神</a>
  </section>
</main>

<footer class="foot">© 2026 彤神</footer>

</body>
</html>
